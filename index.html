<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌊🌊🌊🌊🌊🌊</title>
    <style>
        :root { 
            --v-clr: #0984e3; --s-clr: #00cec9; --bg: #f0f7fa; 
            --danger: #74b9ff; --success: #55efc4; 
            --card-grad: radial-gradient(circle at center, #1e90ff 0%, #0652ad 70%, #0a3d62 100%);
        }

        /* 全域修正：確保寬度計算包含 padding 與 border */
        * { box-sizing: border-box; }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            padding: 10px; 
            margin: 0; 
            -webkit-tap-highlight-color: transparent;
            /* 核心修正：禁止雙擊縮放，但允許正常捲動 */
            touch-action: manipulation; 
            overflow-x: hidden;
        }
        
        .container { 
            background: white; padding: 25px 15px; border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(9, 132, 227, 0.1); width: 100%; max-width: 480px; 
            position: relative; border: 3px solid #e1f0f7; margin-top: 25px;
        }

        .container::before { 
            content: "🌊"; position: absolute; top: -23px; left: 50%; transform: translateX(-50%); 
            background: white ; width: 46px; height: 46px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            box-shadow: 0 6px 15px rgba(10, 61, 98, 0.3); border: 3px solid #eefaff; z-index: 10;
        }
        
        .mode-switcher { background: #e1f0f7; border-radius: 20px; display: flex; padding: 5px; margin-bottom: 20px; }
        .mode-btn { flex: 1; border: none; padding: 12px; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; color: #5a8da3; background: transparent; }
        .mode-btn.active { background: white; color: var(--v-clr); box-shadow: 0 4px 15px rgba(9, 132, 227, 0.1); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .legend-area { display: flex; flex-direction: column; gap: 2px; }
        .legend-staff { display: flex; gap: 15px; font-size: 14px; font-weight: 800; color: #444; }
        .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; margin-right: 6px; vertical-align: middle; }
        .v-bg { background: var(--v-clr); } .s-bg { background: var(--s-clr); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 15px; }
        .weekday { text-align: center; font-size: 12px; color: #8eb3c5; font-weight: 800; padding-bottom: 8px; }
        
        /* 修正格點：增加禁止選取屬性，防止長按彈出選單 */
        .day { 
            aspect-ratio: 0.82; display: flex; flex-direction: column; border-radius: 18px; 
            border: 2px solid #f0f7fa; overflow: hidden; background: #fff; cursor: pointer; 
            position: relative; -webkit-user-select: none; user-select: none;
        }
        .date-num { font-size: 11px; padding: 6px; color: #8eb3c5; font-weight: bold; position: absolute; z-index: 2; }
        .slot { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: white; }
        
        .is-full-v .slot-am { flex: 1; font-size: 16px; background: var(--v-clr); }
        .is-full-s .slot-am { flex: 1; font-size: 16px; background: var(--s-clr); color: #0a3d62; }
        .is-full-v .slot-pm, .is-full-s .slot-pm { display: none; }

        .salary-card { 
            position: relative; border-radius: 25px; padding:16px 22px; display: none; margin-top: 15px; 
            background: var(--card-grad); border: 3.5px solid #74b9ff; 
            box-shadow: 0 15px 40px rgba(10, 61, 98, 0.3); transition: all 0.4s ease; cursor: pointer; overflow: hidden; 
        }
        .salary-card.show { display: block; animation: slideUp 0.4s ease; }
        
        #salary-title { 
            font-size: 14px; font-weight: 800; color: #ffffff !important; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 2px;
        }
        .salary-main { font-size: 30px; font-weight: 900; color: #ffffff !important; }
        #days-v, #days-v + small, #salaryFormula, .bonus-hint { color: #ffffff !important; font-weight: 800; }
        #statusBadge { background: rgba(255,255,255,0.25); border: none; border-radius: 12px; padding: 5px 14px; font-size: 11px; font-weight: 900; color: #ffffff !important; }

        .bonus-container { max-height: 0; opacity: 0; transition: all 0.4s ease; margin-top: 0; }
        .salary-card.active .bonus-container { max-height: 100px; opacity: 1; margin-top: 15px; }
        .bonus-inner { display: flex; gap: 10px; }
        .bonus-box { 
            flex: 1; background: rgba(0, 0, 0, 0.15); padding: 10px; border-radius: 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            border: 1px solid rgba(255,255,255,0.15); 
        }
        .bonus-box label { font-size: 10px; font-weight: 800; color: #74b9ff !important; }
        
        /* 核心修正：字體設為 16px 防止自動縮放，再用 transform 縮小視覺體積 */
        .bonus-box input { 
            border: none; background: transparent; color: #ffffff !important; 
            width: 60px; font-weight: 900; outline: none; text-align: right; 
            font-size: 16px; 
        }

        .salary-card.is-paid { 
            background: rgba(255, 255, 255, 0.6) !important; 
            border: 2px solid var(--s-clr) !important; 
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.1) !important;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .salary-card.is-paid :is(#salary-title, .salary-main, #days-v, #days-v + small, #salaryFormula, .bonus-hint, #statusBadge) { 
            color: #009a9a !important; text-shadow: none !important; 
        }
        .salary-card.is-paid .bonus-box { background: rgba(0, 206, 201, 0.05); border-color: rgba(0, 206, 201, 0.1); }
        .salary-card.is-paid .bonus-box label { color: #009a9a !important; }
        .salary-card.is-paid .bonus-box input { color: #009a9a !important; }

        #adminArea { margin-top: 20px; display: none; width: 100%; }
        .admin-section { background: white; border: 2px solid #e1f0f7; border-radius: 25px; padding: 18px; margin-bottom: 15px; width: 100%; }
        .section-title { font-size: 14px; font-weight: 800; color: var(--v-clr); display: block; margin-bottom: 15px; }
        
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f0f7fa; width: 100%; gap: 10px; }
        .pending-left { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
        .pending-ym { font-size: 15px; font-weight: 800; color: #444; flex-shrink: 0; }
        .pending-formula { font-size: 10px; color: #b2bec3; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pending-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .pending-amount { font-size: 16px; font-weight: 900; color: var(--v-clr); }
        .quick-pay-btn { border: none; padding: 8px 14px; border-radius: 12px; font-size: 11px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .quick-pay-btn.btn-ready { background: var(--v-clr) !important; color: #fff !important; }
        .quick-pay-btn.btn-wait { background: #f0f7fa !important; color: #b2bec3 !important; cursor: not-allowed; }

        .config-row { display: flex; gap: 15px; width: 100%; }
        .config-group { flex: 1; display: flex; flex-direction: column; }
        .config-label { font-size: 10px; color: #8eb3c5; font-weight: bold; margin-bottom: 6px; }
        .config-input { 
            width: 100%; border: 2px solid #e1f0f7; padding: 12px; border-radius: 15px; 
            outline: none; font-weight: 800; color: #444; background: #fff; text-align: center; 
            font-size: 16px; /* 防止縮放 */
        }

        #yearSel, #monthSel { border: 2px solid #e1f0f7; background: white; font-weight: bold; padding: 6px 12px; border-radius: 12px; color: var(--v-clr); outline: none; font-size: 14px; }
        .note-area { 
            width: 100%; border: 2px solid #e1f0f7; border-radius: 20px; padding: 15px; 
            height: 75px; margin-top: 15px; background: #fff; resize: none; outline: none; 
            font-size: 16px; /* 防止縮放 */
        }
        .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .stats-table td { padding: 15px 0; border-bottom: 1px solid #f0f7fa; font-weight: 800; text-align: center; }
        @keyframes slideUp { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    <div class="mode-switcher">
        <button class="mode-btn active" onclick="switchMode('v')">排班模式</button>
        <button class="mode-btn" onclick="switchMode('admin')">數據統計</button>
    </div>
    
    <div id="vArea">
        <div class="toolbar">
            <div class="legend-area">
                <div class="legend-staff"><div><span class="dot v-bg"></span>V</div><div><span class="dot s-bg"></span>S</div></div>
                <div style="font-size:10px;color:#8eb3c5;font-weight:bold;">14:30-18:30 / 18:30-23:00</div>
            </div>
            <div style="display:flex; gap:8px;">
                <button id="lockBtn" style="width:38px;height:38px;border-radius:50%;border:2px solid #e1f0f7;background:white;display:flex;align-items:center;justify-content:center;" onclick="toggleConfirm()">
                    <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:#8eb3c5;stroke-width:3.5;"><path d="M20 6L9 17L4 12"></path></svg>
                </button>
                <select id="yearSel"></select><select id="monthSel"></select>
            </div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
        
        <div class="salary-card" id="salaryCard" onclick="this.classList.toggle('active')">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div id="salary-title"></div>
                <button id="statusBadge"></button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div style="display:flex; align-items:baseline; gap:8px;">
                    <div class="salary-main" id="pay-v" style="font-size:32px; font-weight:900;">$0</div>
                    <div style="text-align: right;">
                        <div style="font-weight:900;"><span id="days-v" style="font-size:22px;">0</span> <small>天</small></div>
                        <div id="salaryFormula" style="font-size:9px;font-weight:bold;"></div>
                    </div>
                </div>
                <div class="bonus-hint" style="font-size:10px;">獎金 ▾</div>
            </div>
            <div class="bonus-container" onclick="event.stopPropagation()">
                <div class="bonus-inner">
                    <div class="bonus-box"><label>月獎金</label><input type="number" id="bt_main" oninput="syncBonus()" placeholder="0"></div>
                    <div class="bonus-box"><label>V獎金</label><input type="number" id="bv_main" oninput="syncBonus()" placeholder="0"></div>
                </div>
            </div>
        </div>
        <textarea id="monthNote" class="note-area" placeholder="當月備註..."></textarea>
    </div>

    <div id="adminArea">
        <div class="admin-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span class="section-title">🌊 未結明細 <span id="pendingTotal" style="color:var(--v-clr);">$0</span></span>
                <button id="copyFinalBtn" style="background:#5a8da3; color:white; border:none; padding:6px 14px; border-radius:12px; font-size:11px; font-weight:bold; cursor:pointer;">複製明細</button>
            </div>
            <div id="pendingList"></div>
        </div>
        <div class="admin-section">
            <span class="section-title">📊 歷史航道</span>
            <table class="stats-table">
                <thead><tr><th style="color:#8eb3c5;padding-bottom:10px;">月份</th><th style="color:#8eb3c5;padding-bottom:10px;">V</th><th style="color:#8eb3c5;padding-bottom:10px;">S</th></tr></thead>
                <tbody id="statsRecordBody"></tbody>
            </table>
        </div>
        <div class="admin-section">
            <span class="section-title">⚙️ 航行參數</span>
            <div class="config-row">
                <div class="config-group">
                    <label class="config-label">參數 A</label>
                    <input type="number" id="baseA" class="config-input" oninput="saveConfig()">
                </div>
                <div class="config-group">
                    <label class="config-label">參數 B</label>
                    <input type="number" id="baseB" class="config-input" oninput="saveConfig()">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /* 核心邏輯不變，僅微調與手機操作相關的部分 */
    const $ = id => document.getElementById(id), KEY = "v_s_v1_purple";
    let Y = $("yearSel"), M = $("monthSel"), pressTimer;

    function saveConfig() { localStorage.setItem("confA", $("baseA").value); localStorage.setItem("confB", $("baseB").value); calc(); }
    function loadConfig() { $("baseA").value = localStorage.getItem("confA") || 1900; $("baseB").value = localStorage.getItem("confB") || 1800; }
    function fmt(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }

    function init() {
    loadConfig();
    const now = new Date();
    const curY = now.getFullYear();
    const curM = now.getMonth() + 1;

    // 1. 嘗試從 localStorage 讀取上次選取的年月，如果沒有就用目前的
    let savedY = localStorage.getItem('lastY') || curY;
    let savedM = localStorage.getItem('lastM') || curM;

    // 2. 初始化年份選單
    for(let y = curY - 1; y <= curY + 2; y++) Y.add(new Option(y, y));
    Y.value = savedY;

    // 3. 初始化月份選單
    const upM = () => {
        M.innerHTML = "";
        for(let m = 1; m <= 12; m++) M.add(new Option(m, m));
        M.value = savedM; // 使用儲存的月份
    };
    upM();

    // 4. 當選單改變時，除了渲染還要儲存目前選擇
    Y.onchange = () => { localStorage.setItem('lastY', Y.value); render(); };
    M.onchange = () => { localStorage.setItem('lastM', M.value); render(); };

    render();
}

    function switchMode(m) {
        document.querySelectorAll('.mode-btn').forEach((b, i) => b.classList.toggle('active', (i===0 && m==='v') || (i===1 && m==='admin')));
        $("vArea").style.display = (m === 'v' ? 'block' : 'none');
        $("adminArea").style.display = (m === 'admin' ? 'block' : 'none');
        if(m==='admin') calc();
    }

    function toggleConfirm() {
        let y=Y.value, m=M.value;
        if(localStorage.getItem(`pd-${y}-${m}`)==='true') return;
        let cur = localStorage.getItem(`cf-${y}-${m}`) === 'true';
        let nextStatus = !cur;
        localStorage.setItem(`cf-${y}-${m}`, nextStatus);
        if(nextStatus) { localStorage.setItem(`lockA-${y}-${m}`, $("baseA").value); localStorage.setItem(`lockB-${y}-${m}`, $("baseB").value); }
        render();
    }

    function quickPay(y, m) {
        if(localStorage.getItem(`cf-${y}-${m}`) !== 'true') return alert("請先確認排班！");
        localStorage.setItem(`pd-${y}-${m}`, 'true');
        render();
    }

    function render() {
        let y=Y.value, m=M.value, k=`${KEY}-${y}-${m}`, data=JSON.parse(localStorage.getItem(k))||{};
        let isPd = localStorage.getItem(`pd-${y}-${m}`)==='true', isCf = localStorage.getItem(`cf-${y}-${m}`)==='true';
        $("vArea").className = isCf ? "is-locked-mode" : "";
        $("lockBtn").style.borderColor = isCf ? "var(--success)" : "#e1f0f7";
        $("lockBtn").style.background = isCf ? "var(--success)" : "white";
        $("lockBtn").querySelector('svg').style.stroke = isCf ? "white" : "#8eb3c5";
        $("salaryCard").className = `salary-card ${isCf?'show':''} ${isPd?'is-paid':''}`;
        $("statusBadge").innerText = isPd ? "已結清" : "待發放";
        $("salary-title").innerText = `${fmt(y, m)} SETTLEMENT`;
        $("bt_main").value = localStorage.getItem(`bt-${y}-${m}`)||"";
        $("bv_main").value = localStorage.getItem(`bv-${y}-${m}`)||"";
        $("bt_main").disabled = isPd; $("bv_main").disabled = isPd;
        $("monthNote").value = localStorage.getItem(`nt-${y}-${m}`)||"";
        let fD=new Date(y, m-1, 1).getDay(), dIM=new Date(y, m, 0).getDate();
        let h = ['SUN','MON','TUE','WED','THU','FRI','SAT'].map(w=>`<div class="weekday">${w}</div>`).join('');
        for(let i=0;i<fD;i++) h+='<div class="day empty"></div>';
        for(let d=1; d<=dIM; d++) {
            let o=data[d]||{am:'',pm:'',mode:''}, cls = (o.mode==='full-v'?'is-full-v':(o.mode==='full-s'?'is-full-s':''));
            h+=`<div class="day ${cls} ${isCf?'locked':''}" onmousedown="stP(${d})" onmouseup="edP(${d})" ontouchstart="stP(${d})" ontouchend="edP(${d})">
                <div class="date-num">${d}</div><div style="flex:1; display:flex; flex-direction:column; width:100%;">
                <div class="slot slot-am ${o.am?o.am+'-bg':''}">${o.am.toUpperCase()}</div>
                <div class="slot slot-pm ${o.pm?o.pm+'-bg':''}">${o.pm.toUpperCase()}</div>
                </div></div>`;
        }
        $("calendarGrid").innerHTML=h; calc();
    }

    // 修正點擊與長按邏輯，增加 touch 事件相容性
    function stP(d){ if(localStorage.getItem(`cf-${Y.value}-${M.value}`)==='true') return; pressTimer=setTimeout(()=>{ let k=`${KEY}-${Y.value}-${M.value}`, data=JSON.parse(localStorage.getItem(k))||{}; data[d]={am:'',pm:'',mode:''}; localStorage.setItem(k, JSON.stringify(data)); render(); }, 600); }
    function edP(d){ clearTimeout(pressTimer); if(pressTimer) hClick(d); pressTimer = null; }
    
    function hClick(d){
        if(localStorage.getItem(`cf-${Y.value}-${M.value}`)==='true') return;
        let k=`${KEY}-${Y.value}-${M.value}`, data=JSON.parse(localStorage.getItem(k))||{};
        let ms=['','full-v','full-s','s-am-v-pm','v-am-s-pm'], cur=data[d]?.mode||'', n=ms[(ms.indexOf(cur)+1)%ms.length];
        let map={'':{am:'',pm:'',mode:''}, 'full-v':{am:'v',pm:'v',mode:'full-v'}, 's-am-v-pm':{am:'s',pm:'v',mode:'s-am-v-pm'}, 'v-am-s-pm':{am:'v',pm:'s',mode:'v-am-s-pm'}, 'full-s':{am:'s',pm:'s',mode:'full-s'}};
        data[d]=map[n]; localStorage.setItem(k, JSON.stringify(data)); render();
    }

    function syncBonus() { if(localStorage.getItem(`pd-${Y.value}-${M.value}`)==='true') return; localStorage.setItem(`bt-${Y.value}-${M.value}`, $("bt_main").value); localStorage.setItem(`bv-${Y.value}-${M.value}`, $("bv_main").value); calc(); }

    function calc() {
        let globalA = parseFloat($("baseA").value)||1900, globalB = parseFloat($("baseB").value)||1800;
        let pool=0, sH="", pL="";
        const allKeys = Object.keys(localStorage).filter(k => k.startsWith(KEY + "-")).sort();
        allKeys.forEach(key => {
            let [y, m] = key.replace(KEY + "-", "").split('-').map(Number);
            let d=JSON.parse(localStorage.getItem(key))||{}, v=0;
            Object.keys(d).forEach(k=>{ if(d[k].am==='v')v+=0.5; if(d[k].pm==='v')v+=0.5; });
            let isPd = localStorage.getItem(`pd-${y}-${m}`)==='true', isCf = localStorage.getItem(`cf-${y}-${m}`)==='true';
            let hA = (isCf || isPd) ? (parseFloat(localStorage.getItem(`lockA-${y}-${m}`))||globalA) : globalA;
            let mbv = parseFloat(localStorage.getItem(`bv-${y}-${m}`))||0, mbt = parseFloat(localStorage.getItem(`bt-${y}-${m}`))||0;
            let mvb = Math.round(v * (hA/30)), vt = mvb + mbv;
            if(!isPd && vt > 0){ 
                pool += vt;
                pL += `<div class="pending-item">
                        <div class="pending-left"><span class="pending-ym">${fmt(y,m)}</span><span class="pending-formula">(${hA}/30)×${v}${mbv>0?`+${mbv}`:''}</span></div>
                        <div class="pending-right"><span class="pending-amount">$${vt.toLocaleString()}</span><button class="quick-pay-btn ${isCf?'btn-ready':'btn-wait'}" onclick="quickPay(${y},${m})">${isCf?'結清':'待領'}</button></div>
                       </div>`; 
            }
            sH += `<tr><td>${isPd?'✅':'⏳'} ${fmt(y, m)}</td><td style="color:var(--v-clr)">$${vt.toLocaleString()}</td><td style="color:var(--s-clr)">$${((hA+globalB)-mvb+(mbt-mbv)).toLocaleString()}</td></tr>`;
            if(y == Y.value && m == M.value) { $("pay-v").innerText=`$${vt.toLocaleString()}`; $("days-v").innerText=v; $("salaryFormula").innerText=`(${hA}/30)×${v}${mbv>0?`+${mbv}`:''}`; }
        });
        $("pendingTotal").innerText=`$${pool.toLocaleString()}`; $("pendingList").innerHTML=pL||'<div style="text-align:center;padding:20px 0;color:#ccc;font-size:12px;">無待領項目</div>'; $("statsRecordBody").innerHTML=sH;
    }

    $("copyFinalBtn").onclick = () => {
        let items=[], total=0;
        Object.keys(localStorage).filter(k => k.startsWith(KEY + "-")).sort().forEach(k => {
            let [y, m] = k.replace(KEY + "-", "").split('-').map(Number);
            if(localStorage.getItem(`pd-${y}-${m}`)==='true' || localStorage.getItem(`cf-${y}-${m}`)!=='true') return;
            let baseA = parseFloat(localStorage.getItem(`lockA-${y}-${m}`)) || parseFloat($("baseA").value) || 1900;
            let v=0, d=JSON.parse(localStorage.getItem(k))||{}; Object.keys(d).forEach(k=>{if(d[k].am==='v')v+=0.5; if(d[k].pm==='v')v+=0.5;});
            let bv=parseFloat(localStorage.getItem(`bv-${y}-${m}`))||0;
            let mt = Math.round(v * (baseA/30)) + bv;
            if(mt>0) { 
                items.push(`· ${fmt(y,m)}: $${mt.toLocaleString()} (${v}天${bv>0?`+獎金$${bv}`:''})`); 
                total+=mt; 
            }
        });
        if(items.length){ 
            let txt=`未結算明細\n----------\n${items.join('\n')}\n----------\n總計: $${total.toLocaleString()}`; 
            let el=document.createElement('textarea'); el.value=txt; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); 
            alert("明細已複製！"); 
        }
    };
    init(); $("monthNote").oninput=()=>{localStorage.setItem(`nt-${Y.value}-${M.value}`,$("monthNote").value);};
</script>
</body>
</html>
