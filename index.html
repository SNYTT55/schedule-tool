<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海洋班表 V1.9.9</title>
    <style>
        :root { 
            --v-clr: #0984e3; --s-clr: #fbc531; --bg: #e1f5fe; --danger: #ff7675; --success: #00cec9;
            --ocean-grad: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            --card-grad: radial-gradient(circle at center, #00cec9 0%, #0984e3 70%, #0a3d62 100%);
        }
        body { font-family: -apple-system, "微軟正黑體", sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 10px; margin: 0; -webkit-tap-highlight-color: transparent; }
        .container { background: white; padding: 25px 15px; border-radius: 45px; box-shadow: 0 20px 50px rgba(9, 132, 227, 0.15); width: 100%; max-width: 480px; box-sizing: border-box; position: relative; border: 4px solid #b3e5fc; }
        .container::before { content: "🐳"; position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 6px 12px rgba(9, 132, 227, 0.2); border: 3px solid #b3e5fc; z-index: 10; }
        .mode-switcher { background: #e1f5fe; border-radius: 25px; display: flex; padding: 6px; margin-bottom: 20px; }
        .mode-btn { flex: 1; border: none; padding: 12px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; color: #546e7a; background: transparent; }
        .mode-btn.active { background: white; color: var(--v-clr); box-shadow: 0 4px 15px rgba(9, 132, 227, 0.1); }
        .legend-area { display: flex; flex-direction: column; gap: 2px; }
        .legend-staff { display: flex; gap: 15px; font-size: 14px; font-weight: 800; color: #455a64; }
        .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
        .v-bg { background: var(--v-clr); box-shadow: 0 0 8px rgba(9, 132, 227, 0.4); } 
        /* 這裡調整了金色光暈的 RGB 數值 */
        .s-bg { background: var(--s-clr); box-shadow: 0 0 8px rgba(251, 197, 49, 0.4); }
        .time-label { font-size: 10px; color: #81d4fa; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 15px; }
        .weekday { text-align: center; font-size: 12px; color: #81d4fa; font-weight: 800; padding-bottom: 8px; }
        .day { aspect-ratio: 0.7; display: flex; flex-direction: column; border-radius: 18px; border: 2px solid #f1f8fb; overflow: hidden; position: relative; background: #fff; cursor: pointer; transition: transform 0.1s; }
        .date-num { font-size: 11px; padding: 5px; color: #b3e5fc; font-weight: bold; position: absolute; z-index: 2; }
        .slot { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: white; }
        .is-locked-mode .day { aspect-ratio: 1.2; border-radius: 12px; }
        .is-full-v .slot-am { flex: 1; font-size: 15px; background: var(--v-clr); }
        .is-full-s .slot-am { flex: 1; font-size: 15px; background: var(--s-clr); }
        .is-full-v .slot-pm, .is-full-s .slot-pm { display: none; }
        .salary-card { position: relative; overflow: hidden; border-radius: 35px; padding: 22px; display: none; margin-top: 15px; background: var(--card-grad); border: 4px solid #fff; box-shadow: 0 15px 40px rgba(9, 132, 227, 0.3); }
        .salary-card::after { content: "🫧"; position: absolute; right: 10px; top: 10px; opacity: 0.3; font-size: 30px; }
        .salary-card.show { display: block; animation: bubbleUp 0.5s ease; }
        .salary-card.is-paid { background: linear-gradient(135deg, #546e7a 0%, #263238 100%); border-color: #cfd8dc; }
        #salary-title { font-size: 12px; color: rgba(255,255,255,0.9); font-weight: 800; letter-spacing: 1px; }
        #statusBadge { background: rgba(255,255,255,0.2); border: 1.5px solid white; border-radius: 12px; padding: 4px 10px; font-size: 9px; font-weight: 900; color: white; backdrop-filter: blur(5px); }
        .salary-main { font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.2); line-height: 1; }
        .bonus-box { flex: 1; background: rgba(255, 255, 255, 0.15); padding: 7px 10px; border-radius: 15px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.2); }
        .bonus-box label { font-size: 9px; color: rgba(255,255,255,0.7); margin-bottom: 2px; }
        .bonus-box input { border: none; background: transparent; color: #fff; width: 100%; font-weight: 900; outline: none; font-size: 14px; }
        #adminArea { margin-top: 20px; display: none; }
        .admin-section { background: white; border: 2px solid #e1f5fe; border-radius: 30px; padding: 20px; margin-bottom: 15px; }
        .section-title { font-size: 14px; font-weight: 800; color: var(--v-clr); display: block; margin-bottom: 10px; }
        .config-input { width: 100%; border: 2px solid #e1f5fe; padding: 12px; border-radius: 15px; outline: none; font-weight: 800; color: #455a64; margin-top: 5px; box-sizing: border-box; }
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f1f8fb; }
        .pending-ym { font-size: 14px; font-weight: 800; color: #455a64; margin-right: 6px; }
        .pending-formula-inline { font-size: 10px; color: #b0bec5; }
        .pending-amount { font-size: 16px; font-weight: 900; color: var(--v-clr); margin-right: 10px; }
        .quick-pay-btn { border: none; padding: 6px 14px; border-radius: 12px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lock-btn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #e1f5fe; background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .lock-btn.active { border-color: var(--success); background: var(--success); }
        .lock-btn svg { width: 22px; height: 22px; fill: none; stroke: #b3e5fc; stroke-width: 3.5; }
        .lock-btn.active svg { stroke: white; }
        #yearSel, #monthSel { border: 2px solid #e1f5fe; background: white; font-weight: bold; padding: 6px 12px; border-radius: 12px; color: var(--v-clr); outline: none; }
        .note-area { width: 100%; border: 2px solid #e1f5fe; border-radius: 25px; padding: 15px; font-size: 14px; height: 80px; margin-top: 15px; box-sizing: border-box; background: #fff; resize: none; outline: none; color: #546e7a; }
        #salaryFormula { margin-top: 10px; font-size: 9px; color: rgba(255,255,255,0.45); text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
        .stats-table { width:100%; border-collapse:collapse; font-size:12px; text-align:center; }
        .stats-table th { color: #b3e5fc; padding-bottom: 8px; font-weight: 800; }
        @keyframes bubbleUp { 0% { opacity: 0; transform: translateY(20px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>
<div class="container">
    <div class="mode-switcher">
        <button class="mode-btn active" onclick="switchMode('v')">🐚 排班模式</button>
        <button class="mode-btn" onclick="switchMode('admin')">📊 數據統計</button>
    </div>
    <div id="vArea">
        <div class="toolbar">
            <div class="legend-area">
                <div class="legend-staff">
                    <div><span class="dot v-bg"></span>V</div>
                    <div><span class="dot s-bg"></span>S</div>
                </div>
                <div class="time-label">14:30-18:30 / 18:30-23:00</div>
            </div>
            <div style="display:flex; gap:8px;">
                <button id="lockBtn" class="lock-btn" onclick="toggleConfirm()"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></button>
                <select id="yearSel"></select><select id="monthSel"></select>
            </div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div class="salary-card" id="salaryCard">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div id="salary-title"></div> <button id="statusBadge"></button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div style="display:flex; align-items:baseline; gap:6px;">
                    <div class="salary-main" id="pay-v">$0</div>
                    <div style="color:rgba(255,255,255,0.8); font-weight:800;"><span id="days-v" style="font-size:20px;">0</span> <small style="font-size:10px;">Days</small></div>
                </div>
                <div style="display:flex; gap:6px; flex:0 0 145px;">
                    <div class="bonus-box"><label>Bonus</label><input type="number" id="bt_main" oninput="syncBonus()" placeholder="0"></div>
                    <div class="bonus-box"><label>V獎金</label><input type="number" id="bv_main" oninput="syncBonus()" placeholder="0"></div>
                </div>
            </div>
            <div id="salaryFormula"></div> </div>
        <textarea id="monthNote" class="note-area" placeholder="📝 寫點什麼吧..."></textarea>
    </div>
    <div id="adminArea">
        <div class="admin-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span class="section-title">📍 待領珍珠 <span id="pendingTotal" style="color:var(--v-clr);">$0</span></span>
                <button id="copyFinalBtn" style="background:var(--v-clr); color:white; border:none; padding:8px 16px; border-radius:15px; font-size:11px; font-weight:bold; cursor:pointer;">複製明細</button>
            </div>
            <div id="pendingList"></div>
        </div>
        <div class="admin-section">
            <span class="section-title">📊 歷史航道</span>
            <table class="stats-table">
                <thead><tr><th>月份</th><th>V</th><th>S</th></tr></thead>
                <tbody id="statsRecordBody"></tbody>
            </table>
        </div>
        <div class="admin-section">
            <span class="section-title">⚙️ 參數航標</span>
            <div style="display:flex; gap:12px;">
                <div style="flex:1;"><label style="font-size:10px; color:#90a4ae;">參數 A</label><input type="number" id="baseA" class="config-input" oninput="saveConfig()"></div>
                <div style="flex:1;"><label style="font-size:10px; color:#90a4ae;">參數 B</label><input type="number" id="baseB" class="config-input" oninput="saveConfig()"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id), KEY = "v_s_v1_purple";
    let Y = $("yearSel"), M = $("monthSel"), pressTimer;
    function saveConfig() { localStorage.setItem("confA", $("baseA").value); localStorage.setItem("confB", $("baseB").value); calc(); }
    function loadConfig() { $("baseA").value = localStorage.getItem("confA") || 1900; $("baseB").value = localStorage.getItem("confB") || 1800; }
    function fmt(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }
    function init() { loadConfig(); const curY = new Date().getFullYear(); for(let y = curY-1; y <= curY+2; y++) Y.add(new Option(y, y)); const upM = () => { let cur = M.value||(new Date().getMonth()+1); M.innerHTML=""; for(let m=1;m<=12;m++) M.add(new Option(m, m)); M.value=cur; }; Y.value = curY; upM(); Y.onchange = render; M.onchange = render; render(); }
    function switchMode(m) { document.querySelectorAll('.mode-btn').forEach((b, i) => b.classList.toggle('active', (i===0 && m==='v') || (i===1 && m==='admin'))); $("vArea").style.display = (m === 'v' ? 'block' : 'none'); $("adminArea").style.display = (m === 'admin' ? 'block' : 'none'); if(m==='admin') calc(); }
    function toggleConfirm() { let y=Y.value, m=M.value; if(localStorage.getItem(`pd-${y}-${m}`)==='true') return; let cur = localStorage.getItem(`cf-${y}-${m}`) === 'true'; let nextStatus = !cur; localStorage.setItem(`cf-${y}-${m}`, nextStatus); if(nextStatus) { localStorage.setItem(`lockA-${y}-${m}`, $("baseA").value); localStorage.setItem(`lockB-${y}-${m}`, $("baseB").value); } render(); }
    function quickPay(y, m) { if(localStorage.getItem(`cf-${y}-${m}`) !== 'true') return alert("請先確認航程！"); localStorage.setItem(`pd-${y}-${m}`, 'true'); render(); }
    function render() {
        let y=Y.value, m=M.value, k=`${KEY}-${y}-${m}`, data=JSON.parse(localStorage.getItem(k))||{};
        let isPd = localStorage.getItem(`pd-${y}-${m}`)==='true', isCf = localStorage.getItem(`cf-${y}-${m}`)==='true';
        $("vArea").className = isCf ? "is-locked-mode" : "";
        $("lockBtn").classList.toggle('active', isCf);
        $("salaryCard").className = `salary-card ${isCf?'show':''} ${isPd?'is-paid':''}`;
        $("statusBadge").innerText = isPd ? "已結清" : "待發放";
        $("salary-title").innerText = `${fmt(y, m)} SETTLEMENT`;
        $("bt_main").value = localStorage.getItem(`bt-${y}-${m}`)||"";
        $("bv_main").value = localStorage.getItem(`bv-${y}-${m}`)||"";
        $("monthNote").value = localStorage.getItem(`nt-${y}-${m}`)||"";
        let fD=new Date(y, m-1, 1).getDay(), dIM=new Date(y, m, 0).getDate();
        let h = ['SUN','MON','TUE','WED','THU','FRI','SAT'].map(w=>`<div class="weekday">${w}</div>`).join('');
        for(let i=0;i<fD;i++) h+='<div class="day empty" style="border:none; background:transparent;"></div>';
        for(let d=1; d<=dIM; d++) {
            let o=data[d]||{am:'',pm:'',mode:''}, cls = (o.mode==='full-v'?'is-full-v':(o.mode==='full-s'?'is-full-s':''));
            h+=`<div class="day ${cls} ${isCf?'locked':''}" onmousedown="stP(${d})" onmouseup="edP(${d})" ontouchstart="stP(${d})" ontouchend="edP(${d})">
                <div class="date-num">${d}</div><div style="flex:1; display:flex; flex-direction:column; width:100%;">
                <div class="slot slot-am ${o.am?o.am+'-bg':''}">${o.am.toUpperCase()}</div>
                <div class="slot slot-pm ${o.pm?o.pm+'-bg':''}">${o.pm.toUpperCase()}</div>
                </div></div>`;
        }
        $("calendarGrid").innerHTML=h; calc();
    }
    function stP(d){ if(localStorage.getItem(`cf-${Y.value}-${M.value}`)==='true') return; pressTimer=setTimeout(()=>{ let k=`${KEY}-${Y.value}-${M.value}`, data=JSON.parse(localStorage.getItem(k))||{}; data[d]={am:'',pm:'',mode:''}; localStorage.setItem(k, JSON.stringify(data)); render(); }, 600); }
    function edP(d){ clearTimeout(pressTimer); if(pressTimer) hClick(d); }
    function hClick(d){ if(localStorage.getItem(`cf-${Y.value}-${M.value}`)==='true') return; let k=`${KEY}-${Y.value}-${M.value}`, data=JSON.parse(localStorage.getItem(k))||{}; let ms=['','full-v','full-s','s-am-v-pm','v-am-s-pm'], cur=data[d]?.mode||'', n=ms[(ms.indexOf(cur)+1)%ms.length]; let map={'':{am:'',pm:'',mode:''}, 'full-v':{am:'v',pm:'v',mode:'full-v'}, 's-am-v-pm':{am:'s',pm:'v',mode:'s-am-v-pm'}, 'v-am-s-pm':{am:'v',pm:'s',mode:'v-am-s-pm'}, 'full-s':{am:'s',pm:'s',mode:'full-s'}}; data[d]=map[n]; localStorage.setItem(k, JSON.stringify(data)); render(); }
    function syncBonus() { localStorage.setItem(`bt-${Y.value}-${M.value}`, $("bt_main").value); localStorage.setItem(`bv-${Y.value}-${M.value}`, $("bv_main").value); calc(); }
    function calc() {
        let globalA = parseFloat($("baseA").value)||1900, globalB = parseFloat($("baseB").value)||1800;
        let pool=0, sH="", pL="";
        const allKeys = Object.keys(localStorage).filter(k => k.startsWith(KEY + "-")).sort();
        allKeys.forEach(key => {
            let [y, m] = key.replace(KEY + "-", "").split('-').map(Number);
            let d=JSON.parse(localStorage.getItem(key))||{}, v=0;
            Object.keys(d).forEach(k=>{ if(d[k].am==='v')v+=0.5; if(d[k].pm==='v')v+=0.5; });
            let isPd = localStorage.getItem(`pd-${y}-${m}`)==='true', isCf = localStorage.getItem(`cf-${y}-${m}`)==='true';
            let hA = (isCf || isPd) ? (parseFloat(localStorage.getItem(`lockA-${y}-${m}`))||globalA) : globalA;
            let mbv = parseFloat(localStorage.getItem(`bv-${y}-${m}`))||0, mbt = parseFloat(localStorage.getItem(`bt-${y}-${m}`))||0;
            let mvb = Math.round(v * (hA/30)), vt = mvb + mbv;
            
            if(!isPd && vt > 0){ 
                pool += vt; 
                pL += `<div class="pending-item">
                        <div style="display:flex; align-items:baseline;">
                            <span class="pending-ym">${fmt(y,m)}</span>
                            <span class="pending-formula-inline">(${hA}/30)×${v}${mbv>0?` + ${mbv}`:''}</span>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="pending-amount">$${vt.toLocaleString()}</span> 
                            <button class="quick-pay-btn" style="background:${isCf?'var(--success)':'#eee'};color:${isCf?'#fff':'#ccc'};" onclick="quickPay(${y},${m})">${isCf?'結清':'待確認'}</button>
                        </div>
                       </div>`; 
            }
            sH += `<tr><td style="padding:10px 0;">${isPd?'✅':'⏳'} ${fmt(y, m)}</td><td style="color:var(--v-clr)">$${vt.toLocaleString()}</td><td style="color:var(--s-clr)">$${((hA+globalB)-mvb+(mbt-mbv)).toLocaleString()}</td></tr>`;
            if(y == Y.value && m == M.value) { 
                $("pay-v").innerText=`$${vt.toLocaleString()}`; 
                $("days-v").innerText=v; 
                $("salaryFormula").innerText=`(${hA}/30) × ${v}${mbv > 0 ? ` + ${mbv}` : ''} = ${vt}`; 
            }
        });
        $("pendingTotal").innerText=`$${pool.toLocaleString()}`; 
        $("pendingList").innerHTML=pL||'<div style="text-align:center;padding:20px 0;color:#ccc;font-size:12px;">海面平靜，無待領珍珠</div>'; 
        $("statsRecordBody").innerHTML=sH;
    }
    
    $("copyFinalBtn").onclick = () => {
        let items=[], total=0;
        const allKeys = Object.keys(localStorage).filter(k => k.startsWith(KEY + "-")).sort();
        allKeys.forEach(key => {
            let [y, m] = key.replace(KEY + "-", "").split('-').map(Number);
            let isPd = localStorage.getItem(`pd-${y}-${m}`)==='true', isCf = localStorage.getItem(`cf-${y}-${m}`)==='true';
            if(!isPd && isCf) {
                let hA = parseFloat(localStorage.getItem(`lockA-${y}-${m}`)) || parseFloat($("baseA").value) || 1900;
                let d=JSON.parse(localStorage.getItem(key))||{}, v=0;
                Object.keys(d).forEach(k=>{ if(d[k].am==='v')v+=0.5; if(d[k].pm==='v')v+=0.5; });
                let mbv = parseFloat(localStorage.getItem(`bv-${y}-${m}`))||0;
                let vt = Math.round(v * (hA/30)) + mbv;
                if(vt > 0) {
                    items.push(`· ${fmt(y,m)}: $${vt.toLocaleString()} (${v}天${mbv>0?` + V獎金$${mbv}`:''}）`);
                    total += vt;
                }
            }
        });
        if(items.length){
            let txt=`未結算明細\n----------\n${items.join('\n')}\n----------\n總計: $${total.toLocaleString()}`;
            let el=document.createElement('textarea'); el.value=txt; document.body.appendChild(el); el.select();
            document.execCommand('copy'); document.body.removeChild(el);
            alert("明細已存入珍珠貝中！");
        } else { alert("目前沒有已確認的待領珍珠喔！"); }
    };
    init(); 
    $("monthNote").oninput=()=>{localStorage.setItem(`nt-${Y.value}-${M.value}`,$("monthNote").value);};
</script>
</body>
</html>
